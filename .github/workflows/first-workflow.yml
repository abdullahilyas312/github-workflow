name: myfirst job
on: push
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: setup node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: installing node modules
        run: npm ci
      - name: build next.js application
        run: npm run build
